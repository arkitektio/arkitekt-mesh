[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/smoltcp",
    "crates/embassy",
    "crates/mesh",
    "crates/web",
    "crates/meshd",
    "crates/mesh-py",
]
# smoltcp's name for the fork, for a firmware's [patch.crates-io]: a second
# package called smoltcp beside upstream's would confuse `-p smoltcp`.
exclude = ["crates/smoltcp-patch"]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/arkitektio/arkitekt-mesh"
homepage = "https://github.com/arkitektio/arkitekt-mesh"

[workspace.dependencies]
mesh = { path = "crates/mesh", version = "0.9.0", package = "arkitekt-mesh" }
# Without std by default: the std crates ask for it.
mesh-core = { path = "crates/core", version = "0.9.0", package = "arkitekt-mesh-core", default-features = false }
mesh-embassy = { path = "crates/embassy", version = "0.9.0", package = "arkitekt-mesh-embassy" }
# Our smoltcp fork, for mesh-core's `fast-tcp`.
mesh-smoltcp = { path = "crates/smoltcp", version = "0.9.0", package = "arkitekt-mesh-smoltcp", default-features = false }

async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "signal", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Tests only.
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
