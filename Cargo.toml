[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/mesh",
    "crates/meshd",
    "crates/mesh-py",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/arkitektio/arkitekt-mesh"
homepage = "https://github.com/arkitektio/arkitekt-mesh"

[workspace.dependencies]
mesh = { path = "crates/mesh", version = "0.7.0", package = "arkitekt-mesh" }
mesh-core = { path = "crates/core", version = "0.7.0", package = "arkitekt-mesh-core" }

async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "signal", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Tests only.
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
