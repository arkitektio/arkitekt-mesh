# Advisories in what only the tests build: rustls-rustcrypto (the ESP32
# firmware's TLS provider, tests/lab_firmware_tls.rs) brings rsa,
# crypto-bigint and rustls-webpki 0.102. None of it is in what ships:
# `cargo tree --workspace -e normal,build -i <crate>` finds nothing.
# Drop an entry when rustls-rustcrypto moves past it.
[advisories]
ignore = [
    "RUSTSEC-2023-0071", # rsa: Marvin attack
    "RUSTSEC-2026-0387", # crypto-bigint: timing
    "RUSTSEC-2026-0049", # rustls-webpki 0.102: CRL matching
    "RUSTSEC-2026-0098", # rustls-webpki 0.102: URI name constraints
    "RUSTSEC-2026-0099", # rustls-webpki 0.102: wildcard name constraints
    "RUSTSEC-2026-0104", # rustls-webpki 0.102: CRL parsing panic
    # Also filed against rustls-webpki 0.103 below .16, which ships: the lock
    # holds .17. An entry here hides it there too, so check on a downgrade.
    "RUSTSEC-2026-0382", # rustls-webpki 0.102: distrusted intermediates
]
