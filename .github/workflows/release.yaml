name: release

# `arkitekt-mesh` on PyPI: the in-process Python bindings (crates/mesh-py),
# as abi3 wheels for every platform plus an sdist, published with PyPI trusted
# publishing (this workflow, no environment). Every wheel is installed and run
# on its platform before anything is published. The runbook:
# docs/releasing-python.md.
#
# It publishes when it runs on a tag whose version is the workspace version:
# - `vX.Y.Z`, the release's own tag. ci.yml's `release` job starts this
#   workflow on it after every release (the tag itself starts nothing, as it
#   is pushed with GITHUB_TOKEN).
# - `mesh-vX.Y.Z`, pushed by hand, to publish outside of that.
#
# Run it by hand on a branch (workflow_dispatch) to build and smoke-test
# everything without publishing.
on:
  workflow_dispatch:
  push:
    tags: ["mesh-v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          cargo_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "arkitekt-mesh-py") | .version')"
          # A run on a branch builds the workspace version.
          version="$cargo_version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#mesh-}"
            version="${version#v}"
          fi
          if [ "$version" != "$cargo_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $cargo_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The bindings against the Go harness (as in meshd.yml), on the tagged commit.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/mesh/tests/harness/go.mod
          cache-dependency-path: crates/mesh/tests/harness/go.sum
      - uses: astral-sh/setup-uv@v6
      - name: Build the bindings and test them
        working-directory: crates/mesh-py
        shell: bash
        run: |
          uv venv
          uv pip install maturin pytest
          uv run maturin develop --uv
          uv run pytest tests

  # LICENSE-THIRD-PARTY in every wheel and the sdist: the Rust crates
  # compiled into the bindings.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-about --locked --features cli
      - working-directory: crates/mesh-py
        run: cargo about generate -c ../meshd/about.toml ../meshd/about.hbs -o ../../LICENSE-THIRD-PARTY
      - uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: LICENSE-THIRD-PARTY

  # abi3 wheels, one per platform: every CPython from 3.9 on.
  wheels:
    needs: [version, test, licenses]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { runner: ubuntu-latest, target: aarch64, manylinux: auto }
          - { runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { runner: macos-14, target: universal2-apple-darwin }
          - { runner: windows-latest, target: x64 }
          - { runner: windows-11-arm, target: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: licenses
          path: crates/mesh-py
      - run: cp LICENSE crates/mesh-py/
        shell: bash
      - uses: PyO3/maturin-action@v1
        env:
          # ring's assembly needs __ARM_ARCH, which the manylinux2014 aarch64
          # cross compiler does not define.
          CFLAGS_aarch64_unknown_linux_gnu: -D__ARM_ARCH=8
        with:
          working-directory: crates/mesh-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out ../../dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist/*.whl

  # From source, for platforms without a wheel. Checks what goes in (the
  # workspace's other crates, the Go harness and local files must not), then
  # builds and runs it.
  sdist:
    needs: [version, test, licenses]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: licenses
          path: crates/mesh-py
      - run: cp LICENSE crates/mesh-py/
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/mesh-py
          command: sdist
          args: --out ../../dist
      - name: Contents
        run: |
          set -euo pipefail
          files="$(tar tzf dist/*.tar.gz)"
          echo "$files"
          if echo "$files" | grep -E '/(target|harness|firmware)/|token\.json|\.(so|pyd)$|/crates/(lovekit|fakts|arkitekt|rekuest|mikro|rath|meshd)/'; then
            echo "unexpected files in the sdist" >&2; exit 1
          fi
          echo "$files" | grep -q '/LICENSE-THIRD-PARTY$'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and run from source
        run: |
          python -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP" && python "$GITHUB_WORKSPACE/crates/mesh-py/tests/smoke_installed.py"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  # Every wheel, installed from the built files (never from source) and run
  # on its platform.
  smoke:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          # `machine`: the interpreter's architecture, asserted by the smoke
          # test, so that no row passes on another platform's wheel.
          # The oldest Python we support, for abi3.
          - { runner: ubuntu-latest, python: "3.9", machine: x86_64 }
          - { runner: ubuntu-24.04-arm, python: "3.13", machine: aarch64, twine: true }
          - { runner: ubuntu-latest, alpine: true, machine: x86_64 }
          - { runner: ubuntu-24.04-arm, alpine: true, machine: aarch64 }
          # arm64 and the x86_64 half of the universal2 wheel.
          - { runner: macos-14, python: "3.13", machine: arm64 }
          - { runner: macos-15-intel, python: "3.12", machine: x86_64 }
          - { runner: windows-latest, python: "3.13", arch: x64, machine: amd64 }
          - { runner: windows-11-arm, python: "3.13", arch: arm64, machine: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@v5
        if: ${{ !matrix.alpine }}
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - name: Install and run
        if: ${{ !matrix.alpine }}
        shell: bash
        env:
          SMOKE_MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          python -m pip install --only-binary :all: --no-index --find-links dist arkitekt-mesh
          cd "$RUNNER_TEMP" && python "$GITHUB_WORKSPACE/crates/mesh-py/tests/smoke_installed.py"
      # musllinux, in Alpine (JavaScript actions don't run in Alpine
      # containers on ARM, so the container is only for this step).
      - name: Install and run (Alpine)
        if: matrix.alpine
        run: |
          docker run --rm -v "$PWD:/w" -w /tmp -e SMOKE_MACHINE=${{ matrix.machine }} python:3.12-alpine sh -euc '
            python -m pip install --only-binary :all: --no-index --find-links /w/dist arkitekt-mesh
            python /w/crates/mesh-py/tests/smoke_installed.py'
      - name: Metadata
        if: matrix.twine
        run: |
          python -m pip install twine
          twine check --strict dist/*

  publish:
    if: github.ref_type == 'tag'
    needs: [sdist, smoke]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A second run for the same version (a re-run, or `mesh-vX.Y.Z` after
          # `vX.Y.Z`) uploads what is missing instead of failing.
          skip-existing: true
