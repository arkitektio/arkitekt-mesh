name: Audit

# Known vulnerabilities in what Cargo.lock pins (RustSec). Apart from CI, so
# an advisory published overnight does not hold a release back: this run goes red
# instead.
on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths: ["**/Cargo.toml", "Cargo.lock"]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Red while an advisory stands. Most of the lockfile is the tests'
      # (reqwest, rustls-rustcrypto): `cargo tree -e normal,build -i <crate>`
      # says whether one is in what ships.
      - run: cargo audit
