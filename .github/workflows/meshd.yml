name: meshd

# The mesh, tested on every platform; and `arkitekt-meshd`, the sidecar binary
# (crates/meshd), attached to the GitHub release for every platform when it
# runs on a tag whose version is the workspace version: `vX.Y.Z`, the
# release's own tag (ci.yml's `release` job starts this workflow on it after
# every release), or a `meshd-vX.Y.Z` pushed by hand. The Python bindings
# (`arkitekt-mesh` on PyPI) are released by release.yaml.
# Everything is our own Rust client (docs/rfc1-rust-only-mesh.md). Go only
# appears in the tests, as the reference tailscale they run against.
#
# Run it by hand on a branch (workflow_dispatch) to build, sign, notarize and
# smoke-test every binary without releasing anything.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["meshd-v*"]
    paths:
      - "crates/mesh/**"
      - "crates/meshd/**"
      - "crates/mesh-py/**"
      - ".github/workflows/meshd.yml"
  pull_request:
    paths:
      - "crates/mesh/**"
      - "crates/meshd/**"
      - "crates/mesh-py/**"
      - ".github/workflows/meshd.yml"

jobs:
  # The Rust node end to end, on every platform we ship for
  # (docs/rfc6-cross-platform.md): against tailscale's test control server
  # and a tsnet peer (the Go harness in crates/mesh/tests/harness).
  test-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/mesh/tests/harness/go.mod
          cache-dependency-path: crates/mesh/tests/harness/go.sum
      - run: cargo test -p arkitekt-mesh --features session,relay
      - run: cargo test -p arkitekt-meshd
      - run: cargo test -p fakts --features mesh-relay

  test-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/mesh/tests/harness/go.mod
          cache-dependency-path: crates/mesh/tests/harness/go.sum
      - uses: astral-sh/setup-uv@v6
      - name: Build the bindings and test them
        working-directory: crates/mesh-py
        shell: bash
        run: |
          uv venv
          uv pip install maturin pytest
          uv run maturin develop --uv
          uv run pytest tests

  # The ARM targets are not tested above (no runner runs the harness there):
  # they must at least build, on every pull request, not only at release.
  check-arm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p arkitekt-meshd -p arkitekt-mesh-py --target ${{ matrix.target }}

  version:
    if: startsWith(github.ref, 'refs/tags/meshd-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          cargo_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "arkitekt-meshd") | .version')"
          # A run on a branch builds the workspace version.
          version="$cargo_version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#meshd-}"
            version="${version#v}"
          fi
          if [ "$version" != "$cargo_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $cargo_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-meshd:
    needs: [test-rust, check-arm, version]
    strategy:
      matrix:
        include:
          # `smoke`: the runner can execute the binary (not a cross build).
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, os: linux, arch: amd64, zig: true, smoke: true }
          - { runner: ubuntu-latest, target: aarch64-unknown-linux-musl, os: linux, arch: arm64, zig: true }
          - { runner: macos-14, target: x86_64-apple-darwin, os: darwin, arch: amd64 }
          - { runner: macos-14, target: aarch64-apple-darwin, os: darwin, arch: arm64, smoke: true }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, os: windows, arch: amd64, smoke: true }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, os: windows, arch: arm64, smoke: true }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build (zig, static musl)
        if: matrix.zig
        run: |
          pip install ziglang cargo-zigbuild
          cargo zigbuild --release -p arkitekt-meshd --target ${{ matrix.target }}
      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release -p arkitekt-meshd --target ${{ matrix.target }}
      - name: Name the binary
        shell: bash
        run: |
          ext=""; [ "${{ matrix.os }}" = windows ] && ext=".exe"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/arkitekt-meshd$ext" \
            "dist/arkitekt-meshd-${{ needs.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}$ext"
      # Developer ID signature with the hardened runtime, then notarization
      # (as konstruktor does, from the organization's secrets). A bare binary
      # cannot be stapled: Gatekeeper checks the ticket online.
      - name: Sign and notarize (macOS)
        if: matrix.os == 'darwin'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          [ -n "$identity" ] || { echo "no Developer ID Application identity in CSC_LINK" >&2; exit 1; }
          binary="$(ls dist/arkitekt-meshd-*)"
          codesign --force --options runtime --timestamp --sign "$identity" "$binary"
          codesign --verify --strict --verbose=2 "$binary"
          ditto -c -k --keepParent "$binary" "$RUNNER_TEMP/meshd.zip"
          xcrun notarytool submit "$RUNNER_TEMP/meshd.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          security delete-keychain "$keychain"
      # The binary runs, and speaks its protocol (docs/rfc6-cross-platform.md).
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          binary="$(ls "$PWD"/dist/arkitekt-meshd-*)"
          "$binary" --version
          # --no-stdin: an empty stdin would be its stop signal.
          out="$("$binary" --no-stdin --statedir "$RUNNER_TEMP/node" --hostname smoke \
            --control-url http://127.0.0.1:1 || true)"
          echo "$out"
          echo "$out" | grep -q '"code":"needs_login"'
      - uses: actions/upload-artifact@v4
        with:
          name: meshd-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  licenses:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-about --locked --features cli
      - working-directory: crates/meshd
        run: cargo about generate about.hbs -o ../../THIRD_PARTY_LICENSES
      - uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: THIRD_PARTY_LICENSES

  release:
    if: github.ref_type == 'tag'
    needs: [build-meshd, licenses]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: meshd-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: licenses
          path: dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum arkitekt-meshd-* > SHA256SUMS)
          # `vX.Y.Z` already has its release (semantic-release made it).
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --notes "arkitekt-meshd ${GITHUB_REF_NAME#meshd-v}: the mesh sidecar for the Rust client."
          fi

