name: meshd

# The mesh for the Rust and Python clients, released together on a
# `meshd-vX.Y.Z` tag (X.Y.Z must be the workspace version):
# - `arkitekt-meshd`, the sidecar binary (crates/meshd), attached to the
#   GitHub release for every platform, and on PyPI as wheels carrying it;
# - `arkitekt-mesh` on PyPI: the in-process Python bindings (crates/mesh-py).
# Everything is our own Rust client (docs/rfc1-rust-only-mesh.md). Go only
# appears in the tests, as the reference tailscale they run against.
on:
  push:
    branches: [main]
    tags: ["meshd-v*"]
    paths:
      - "crates/mesh/**"
      - "crates/meshd/**"
      - "crates/mesh-py/**"
      - ".github/workflows/meshd.yml"
  pull_request:
    paths:
      - "crates/mesh/**"
      - "crates/meshd/**"
      - "crates/mesh-py/**"
      - ".github/workflows/meshd.yml"

jobs:
  # The Rust node end to end, on every platform we ship for
  # (docs/rfc6-cross-platform.md): against tailscale's test control server
  # and a tsnet peer (the Go harness in crates/mesh/tests/harness).
  test-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/mesh/tests/harness/go.mod
          cache-dependency-path: crates/mesh/tests/harness/go.sum
      - run: cargo test -p arkitekt-mesh --features session,relay
      - run: cargo test -p arkitekt-meshd
      - run: cargo test -p fakts --features mesh-relay

  test-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/mesh/tests/harness/go.mod
          cache-dependency-path: crates/mesh/tests/harness/go.sum
      - uses: astral-sh/setup-uv@v6
      - name: Build the bindings and test them
        working-directory: crates/mesh-py
        shell: bash
        run: |
          uv venv
          uv pip install maturin pytest
          uv run maturin develop --uv
          uv run pytest tests

  # The ARM targets are not tested above (no runner runs the harness there):
  # they must at least build, on every pull request, not only at release.
  check-arm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p arkitekt-meshd -p arkitekt-mesh-py --target ${{ matrix.target }}

  version:
    if: startsWith(github.ref, 'refs/tags/meshd-v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          version="${GITHUB_REF_NAME#meshd-v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "arkitekt-meshd") | .version')"
          if [ "$version" != "$cargo_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $cargo_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-meshd:
    needs: [test-rust, check-arm, version]
    strategy:
      matrix:
        include:
          # `wheels`: the wheel platform tags the binary is published under.
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, os: linux, arch: amd64, zig: true, wheels: "manylinux2014_x86_64 musllinux_1_1_x86_64" }
          - { runner: ubuntu-latest, target: aarch64-unknown-linux-musl, os: linux, arch: arm64, zig: true, wheels: "manylinux2014_aarch64 musllinux_1_1_aarch64" }
          - { runner: macos-14, target: x86_64-apple-darwin, os: darwin, arch: amd64, wheels: "macosx_10_12_x86_64" }
          - { runner: macos-14, target: aarch64-apple-darwin, os: darwin, arch: arm64, wheels: "macosx_11_0_arm64" }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, os: windows, arch: amd64, wheels: "win_amd64" }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, os: windows, arch: arm64, wheels: "win_arm64" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build (zig, static musl)
        if: matrix.zig
        run: |
          pip install ziglang cargo-zigbuild
          cargo zigbuild --release -p arkitekt-meshd --target ${{ matrix.target }}
      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release -p arkitekt-meshd --target ${{ matrix.target }}
      - name: Name the binary
        shell: bash
        run: |
          ext=""; [ "${{ matrix.os }}" = windows ] && ext=".exe"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/arkitekt-meshd$ext" \
            "dist/arkitekt-meshd-${{ needs.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}$ext"
      - uses: astral-sh/setup-uv@v6
      - name: Wheels
        shell: bash
        run: |
          version="${{ needs.version.outputs.version }}"
          sed -i.bak "s/^__version__ = .*/__version__ = \"$version\"/" crates/meshd/python/arkitekt_meshd/__init__.py
          binary="$(ls "$PWD"/dist/arkitekt-meshd-*)"
          for platform in ${{ matrix.wheels }}; do
            (cd crates/meshd/python && MESHD_BINARY="$binary" MESHD_PLATFORM="$platform" uv build --wheel -o ../../../wheels)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: meshd-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-meshd-${{ matrix.os }}-${{ matrix.arch }}
          path: wheels/*.whl

  # `arkitekt-mesh`: abi3 wheels of the Python bindings, one per platform.
  build-python:
    needs: [test-python, version]
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { runner: ubuntu-latest, target: aarch64, manylinux: auto }
          - { runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { runner: macos-14, target: universal2-apple-darwin }
          - { runner: windows-latest, target: x64 }
          - { runner: windows-11-arm, target: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/mesh-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out ../../wheels
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-mesh-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: wheels/*.whl

  licenses:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-about --locked --features cli
      - working-directory: crates/meshd
        run: cargo about generate about.hbs -o ../../THIRD_PARTY_LICENSES
      - uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: THIRD_PARTY_LICENSES

  release:
    needs: [build-meshd, licenses]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: meshd-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: licenses
          path: dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum arkitekt-meshd-* > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "arkitekt-meshd ${GITHUB_REF_NAME#meshd-v}: the mesh sidecar for the Rust and Python clients."

  pypi:
    needs: [build-meshd, build-python]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing, for both arkitekt-meshd and arkitekt-mesh
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheels
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
