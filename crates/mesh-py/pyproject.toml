[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "arkitekt-mesh"
description = "Run an Arkitekt mesh node in-process: our own Tailscale-compatible client, with a local HTTP proxy and a TURN relay into a deployment's mesh"
readme = "README.md"
license = "MIT"
# Copied here (and generated by cargo-about) by .github/workflows/release.yaml.
license-files = ["LICENSE*"]
authors = [{ name = "jhnnsrs", email = "jhnnsrs@gmail.com" }]
requires-python = ">=3.9"
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
keywords = ["arkitekt", "mesh", "tailscale", "wireguard", "turn"]

[project.urls]
Homepage = "https://github.com/arkitektio/arkirust"
Repository = "https://github.com/arkitektio/arkirust"
Issues = "https://github.com/arkitektio/arkirust/issues"

[tool.maturin]
python-source = "python"
module-name = "arkitekt_mesh._native"
features = ["pyo3/extension-module"]
