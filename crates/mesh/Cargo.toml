[package]
name = "arkitekt-mesh"
description = "A Tailscale-compatible mesh client: ts2021 control, DERP, disco and WireGuard, in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tailscale", "wireguard", "mesh", "derp", "arkitekt"]
categories = ["network-programming"]
readme = "PROTOCOL.md"
# The Go harness is for this repository's tests only.
exclude = ["tests/harness"]

[lib]
name = "mesh"

[dependencies]
# The sans-IO core: keys, codecs and protocol state machines.
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
blake2 = "0.10"
# Tailnet lock (tka.rs): trusted keys and node-key signatures.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"], optional = true }
crypto_box = { version = "0.9", features = ["salsa20"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
hex.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
smoltcp = { version = "0.13", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-tcp-reno",
    "socket-tcp-cubic",
    "async",
] }

# The tokio driver.
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util"], optional = true }
# The IPv6 UDP socket, IPv6-only (docs/rfc2-ipv6-underlay.md).
socket2 = { version = "0.6", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, optional = true }
webpki-roots = { version = "1", optional = true }
h2 = { version = "0.4", optional = true }
http = { version = "1", optional = true }
bytes = { version = "1", optional = true }
futures = { workspace = true, optional = true }

# A node's session: state directory, identity, and the local HTTP proxy.
hyper = { version = "1", features = ["http1", "server", "client"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"], optional = true }
tower-service = { version = "0.3", optional = true }
http-body-util = { version = "0.1", optional = true }

# The relay: local TCP forwards and a TURN server over the mesh.
turn = { version = "0.17", optional = true }
webrtc-util = { version = "0.17", default-features = false, features = ["conn"], optional = true }
async-trait = { workspace = true, optional = true }

[features]
default = ["tokio", "ring", "udp", "tka-disable", "portmap"]
# Ask the gateway for a port mapping (PCP, NAT-PMP) so peers behind hard
# NATs still get direct paths.
portmap = ["tokio"]
# Verify a tailnet-lock disablement secret (Argon2i, 16 MiB): without it a
# node stays locked, fail-closed, when a tailnet's lock is disabled.
tka-disable = ["dep:argon2"]
# UDP sockets over the tunnel (`Node::bind_udp`).
udp = ["smoltcp/socket-udp"]
# A node with its state directory (identity, remembered control url, one
# node per directory) and the local HTTP proxy into the mesh
# (`driver::Session`): what meshd, fakts and the Python bindings run.
session = ["tokio", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:tower-service"]
# Local TCP forwards and a TURN server that relays over the mesh, for apps
# that cannot use a proxy (WebRTC media, e.g. LiveKit).
relay = ["tokio", "udp", "dep:turn", "dep:webrtc-util", "dep:async-trait"]
# The fallback TLS provider when the app installs none. Without it (e.g. on
# ESP-IDF, where ring's C does not build) the app must install a rustls
# CryptoProvider, such as rustls-rustcrypto, before starting a node.
ring = ["rustls?/ring"]
tokio = [
    "dep:tokio",
    "dep:socket2",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:webpki-roots",
    "dep:h2",
    "dep:http",
    "dep:bytes",
    "dep:futures",
]

[dev-dependencies]
# The ESP32 firmware's TLS provider, for tests/lab_firmware_tls.rs.
rustls-rustcrypto = "0.0.2-alpha"
axum.workspace = true
reqwest.workspace = true
tempfile = "3"
hmac = "0.12"
tokio = { workspace = true, features = ["process"] }
tracing-subscriber.workspace = true

[[test]]
name = "bench"
required-features = ["session"]

[[test]]
name = "relay"
required-features = ["relay"]

[[test]]
name = "lab_restart"
required-features = ["session"]

[[test]]
name = "lock"
required-features = ["session"]

[[test]]
name = "lab_lock"
required-features = ["session"]
