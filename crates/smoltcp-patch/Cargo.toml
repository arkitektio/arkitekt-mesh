# smoltcp 0.13.1 as Cargo sees it, but arkitekt-mesh's fork inside (crates/smoltcp):
# for a firmware's `[patch.crates-io]`, so that embassy-net and the mesh run on
# one TCP/IP stack, the fork's. Cargo patches a crate only with a package of
# its name and version, which crates.io will not take for us; hence this,
# unpublished. Every feature goes through to the fork.
#
# ```toml
# [patch.crates-io]
# smoltcp = { git = "https://github.com/arkitektio/arkitekt-mesh", tag = "vX.Y.Z" }
# ```
#
# The mesh crates must come from the same place (path or git tag), or the fork
# is in the build twice.
[package]
name = "smoltcp"
version = "0.13.1"
edition = "2024"
rust-version = "1.91"
description = "smoltcp's name for arkitekt-mesh's smoltcp fork, for [patch.crates-io]"
license = "0BSD"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
fork = { package = "arkitekt-mesh-smoltcp", path = "../smoltcp", default-features = false }

[features]
default = ["fork/default"]
"std" = ["fork/std"]
"alloc" = ["fork/alloc"]
"verbose" = ["fork/verbose"]
"defmt" = ["fork/defmt"]
"medium-ethernet" = ["fork/medium-ethernet"]
