# The embassy driver (arkitekt-mesh-embassy) on the host: an embassy
# executor on std (platform-std, the std time driver), UDP and TCP through
# async-io, TLS from futures-rustls. `cargo run -- harness` joins the Go
# harness (tailscale's test control, DERP and a peer; needs `go`), `cargo
# run -- lab` the mesh lab's ionskale (its environment loaded), and talks
# to the peer over the tunnel. The only run before hardware. Not a
# workspace member: its std executor must not meet a board's features.
[package]
name = "mesh-embassy-check"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
mesh-embassy = { path = "../../crates/embassy", package = "arkitekt-mesh-embassy" }
mesh-core = { path = "../../crates/core", package = "arkitekt-mesh-core", features = ["std"] }
embassy-executor = { version = "0.10", features = ["platform-std", "executor-thread"] }
embassy-time = { version = "0.5", features = ["std"] }
embassy-futures = "0.1"
embedded-io-async = "0.7"
embedded-io-adapters = { version = "0.7", features = ["futures-03"] }
async-io = "2"
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
critical-section = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
